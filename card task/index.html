<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card - Figma Design</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section class="container">

        <!-- Flip Card -->
        <div class="flip-card">
            <div class="card-inner">
                
                <div class="card-front">
                    <img src="images/Rectangle 5.png" alt="Buildings" class="front-bg">
                    
                    <h1 class="front-title">Financial Sector Development Program</h1>
                 <div class="front-arrow-btn">
                <i class="fa-solid fa-arrow-right"></i>
</div>
                </div>

                <div class="card-back">
                    <img src="images/🦆 icon _map_.png" alt="Logo" class="back-logo">
                    
                    <h1 class="back-title">Financial Sector Development<br> Program</h1></br>
                    <p class="back-paragraph">The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabia's economy.</p>
                    
                    <div class="back-read-more">
                        <span class="read-more-text">Read More</span>
                        <div class="back-arrow-btn">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </section>

</body>
</html>
