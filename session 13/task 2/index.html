<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <form class="row gy-3 mt-3" id="userForm">
            <div class="col-12 col-md-6">
                <input type="text" placeholder="enter your name" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
                <input type="email" placeholder="enter your email" class="form-control" required>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Add User</button>
            </div>
        </form>
        <div id="cards-container" class="mt-3"></div>
    </div>

    <!-- Bootstrap JS & Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
